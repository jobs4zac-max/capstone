# IMMUTABLE SAFETY FLOOR. Version-controlled, human-edited only.
#
# This file is NOT the same thing as data/policy/policy.json:
#
#   safety/policy_zones.yaml   <- this file. The hard boundary. Only a human,
#                                 via a reviewed commit, may change it.
#   data/policy/policy.json    <- runtime-mutable ADAPTIVE parameters only
#                                 (thresholds, retrieval preferences, exemplars).
#                                 policy_rlhf/policy_updater.py may write it.
#
# The split exists because feedback-driven adaptation must never be able to
# erode a refusal boundary. policy_rlhf/policy_checker.py enforces that the
# adaptive layer can only TIGHTEN behaviour relative to this floor, never
# loosen it. See PROJECT_PLAN.md sections 4.5 and 10.8.
#
# Consumed by FOUR places (PROJECT_PLAN.md section 3.4):
#   1. safety/intent_gate.py      -> Zone C deterministic refusal
#   2. safety/risk_rules.py       -> Zone B mandatory escalation
#   3. agent/prompts.py           -> rendered into the system prompt
#   4. tests/safety/test_zones.py -> every zone_b/zone_c entry needs a test
#
# Status: SKELETON - two illustrative entries per zone. Fill out at task T-006
# from the Room 10 scenario document.

version: "0.1.0"

# ---------------------------------------------------------------------------
# Zone A - ALLOWED. The agent may do these.
# ---------------------------------------------------------------------------
zone_a:
  - id: A-01
    action: detect_life_event
    description: Detect supported life events from conversation context.
  - id: A-02
    action: retrieve_policy
    description: Retrieve from approved synthetic policy documentation via RAG.
  # TODO(T-006): remaining Zone A entries from the scenario document.

# ---------------------------------------------------------------------------
# Zone B - STOP / ASK HUMAN. Mandatory escalation; never answered directly.
# ---------------------------------------------------------------------------
zone_b:
  - id: B-01
    trigger: personalised_investment_advice
    description: Personalised investment or allocation decisions with material consequence.
    risk_level: HIGH
    patterns:
      - "should i invest"
      - "where should i put my money"
    escalation_reason: high_risk
    test_ref: tests/safety/test_advisory.py

  - id: B-02
    trigger: tax_or_legal_question
    description: Complex tax or legal interpretation.
    risk_level: HIGH
    patterns:
      - "tax implication"
      - "legally entitled"
    escalation_reason: zone_b_match
    test_ref: tests/safety/test_legal_tax.py
  # TODO(T-006): ambiguous circumstances, conflicting policy, fraud indicators,
  # high-value decisions, missing data, distress signals, undetermined policy.

# ---------------------------------------------------------------------------
# Zone C - PROHIBITED. Deterministic refusal, pre-generation. 100% target.
# Refusal is NOT a dead end: each entry names the documented alternative to
# offer instead (PROJECT_PLAN.md section 10.2).
# ---------------------------------------------------------------------------
zone_c:
  - id: C-01
    trigger: money_movement
    description: Transfers and payments.
    patterns:
      - "transfer"
      - "send money"
      - "make a payment"
    refusal_template: refuse_transaction
    offer_instead: transfer_procedure_info
    test_ref: tests/safety/test_transactional.py

  - id: C-02
    trigger: account_modification
    description: Create, close or modify an account.
    patterns:
      - "close my account"
      - "open an account for me"
      - "change my account"
    refusal_template: refuse_account_change
    offer_instead: account_procedure_info
    test_ref: tests/safety/test_transactional.py
  # TODO(T-006): loan approval, credit limit change, investment execution,
  # beneficiary/ownership change, legal/tax advice, third-party data,
  # policy fabrication.

# ---------------------------------------------------------------------------
# Keys in data/policy/policy.json that the RLHF layer is permitted to touch.
# Anything not listed here is rejected by policy_rlhf/policy_checker.py.
# ---------------------------------------------------------------------------
adaptive_allowlist:
  - clarification_threshold
  - retrieval_preferences
  - approved_exemplars
  - response_style

# ---------------------------------------------------------------------------
# Tool names that must NEVER exist anywhere in the codebase.
# tests/safety/ greps for these.
# ---------------------------------------------------------------------------
forbidden_tools:
  - transfer_money
  - make_payment
  - change_account
  - close_account
  - open_account
  - approve_loan
  - change_credit_limit
  - execute_investment
  - update_beneficiary
  - override_policy
  - delete_customer
