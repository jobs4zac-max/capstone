# CI gate. The safety suite must be green before any merge
# (PROJECT_PLAN.md section 21.4).
#
# Tests run in REPLAY mode: no API calls, no allowance spend, deterministic.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LLM_CACHE_MODE: read
      OBSERVABILITY_ENABLED: "false"
      OPENAI_API_KEY: sk-dummy-for-ci
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Validate mock data integrity
        run: uv run python scripts/validate_data.py
        continue-on-error: true   # TODO(T-028): drop once the script is implemented

      - name: Safety suite (must be green)
        run: uv run pytest tests/safety -q

      - name: Full test suite
        run: uv run pytest -q

      - name: requirements.txt is in sync with uv.lock
        run: |
          uv export --no-hashes --format requirements-txt > /tmp/req.txt
          diff -q /tmp/req.txt requirements.txt || {
            echo "requirements.txt is stale. Run: uv export --no-hashes --format requirements-txt > requirements.txt"
            exit 1
          }
        continue-on-error: true   # TODO: drop once uv.lock is committed
