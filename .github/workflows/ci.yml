# CI — currently MANUAL ONLY.
#
# Not required by the capstone brief: continuous integration appears nowhere in
# the five deliverables, the minimum-bar evidence list, or the evaluation
# checklist. It is engineering hygiene, so it should not be noise while the
# repository is still a skeleton.
#
# Run it on demand: GitHub → Actions → "ci" → "Run workflow".
# Or locally, which is faster and free:
#     uv run ruff check .
#     uv run pytest -q
#
# TO RE-ENABLE AUTOMATIC RUNS once there is real code to guard (suggested at
# Milestone 5, when the guardrail gates land), replace the `on:` block below
# with:
#
#   on:
#     pull_request:
#     workflow_dispatch:
#
# Deliberately PRs only, not `push` — during a 2-week sprint with three people
# pushing to dev constantly, a run per push trains everyone to ignore the
# results. The value is in blocking a merge, and specifically in the safety
# suite: it guards the five 100% criteria (PROJECT_PLAN.md §19.4), which are
# the ones that cannot be recovered by arguing with a grader.

name: ci

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LLM_CACHE_MODE: read
      OBSERVABILITY_ENABLED: "false"
      OPENAI_API_KEY: sk-dummy-for-ci
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Validate mock data integrity
        run: uv run python scripts/validate_data.py
        continue-on-error: true   # TODO(T-028): drop once the script is implemented

      - name: Safety suite (must be green)
        run: uv run pytest tests/safety -q

      - name: Full test suite
        run: uv run pytest -q

      # Non-blocking: `uv export` output can vary with the uv version, and CI
      # installs the latest while we generated requirements.txt locally. A
      # cosmetic diff should not fail the build.
      - name: requirements.txt is in sync with uv.lock
        run: |
          uv export --no-hashes --format requirements-txt > /tmp/req.txt
          diff -q /tmp/req.txt requirements.txt || {
            echo "::warning::requirements.txt may be stale. Regenerate with:"
            echo "  uv export --no-hashes --format requirements-txt > requirements.txt"
          }
        continue-on-error: true
